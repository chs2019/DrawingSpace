name: Integrate parity
on:
  push:
    branches: [feat/visio-parity]
    paths: ['scripts/dev/apply-parity.py']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/DrawingSpace' && github.ref == 'refs/heads/feat/visio-parity'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Integrate assertion-checked source changes
        run: |
          set -euo pipefail
          python3 scripts/dev/apply-parity.py
          git add src tests
          if ! git diff --cached --quiet; then
            git config user.name 'DrawingSpace integration'
            git config user.email 'wieslawsoltes@users.noreply.github.com'
            git commit -m 'fix: integrate parent-local formula frames and preserve semantic identities'
            git push origin HEAD:refs/heads/feat/visio-parity
          fi
          git log -1 --format='%H %T'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Engine and interoperability tests
        run: dotnet test tests/DrawingSpace.Tests -c Release --logger 'trx;LogFileName=integration.trx' --results-directory artifacts/tests
      - name: Compile the actual Uno desktop host
        run: dotnet build src/DrawingSpace.App -f net10.0-desktop -c Release -p:DrawingSpaceDesktopOnly=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-integration-results
          path: artifacts/tests
      - name: Committed source archive
        if: always()
        run: git archive --format=zip --output=/tmp/DrawingSpace-integration-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-integration-source
          path: /tmp/DrawingSpace-integration-source.zip
