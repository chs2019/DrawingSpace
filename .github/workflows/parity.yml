name: Parity
on:
  push:
    branches: [feat/visio-parity]
  pull_request:
permissions:
  contents: read
concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/DrawingSpace.Tests -c Release --logger 'trx;LogFileName=parity.trx' --results-directory artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-parity-tests
          path: artifacts/tests
      - name: Source snapshot
        if: always()
        run: git archive --format=zip --output=/tmp/DrawingSpace-parity-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-parity-source
          path: /tmp/DrawingSpace-parity-source.zip
