name: Build
on:
  push:
    branches: [main, feat/visio-parity]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/DrawingSpace.Tests -c Release --logger 'trx;LogFileName=engine.trx' --results-directory artifacts/test-results
      - name: Verify engine tests actually executed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/test-results/engine.trx').getroot()
          counters = next(e.attrib for e in root.iter() if e.tag.rsplit('}', 1)[-1] == 'Counters')
          total = int(counters['total'])
          assert total >= 501, f'Expected at least 501 engine tests, found {counters}'
          assert int(counters['executed']) == total and int(counters['passed']) == total, counters
          print(f'Confirmed {total} executed and passing engine tests; no skipped or undiscovered suite.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-engine-validation
          path: artifacts/test-results
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebAssembly toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish real Uno WebAssembly application
        run: |
          dotnet publish src/DrawingSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/DrawingSpace/
          python3 scripts/collect-site.py artifacts/publish artifacts/site
      - name: Test browser interaction
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          npm run test:browser
          python3 scripts/publish-preview.py
      - name: Build reusable NuGet packages
        run: |
          for project in src/*/*.csproj; do
            case "$project" in */DrawingSpace.App/*) continue;; esac
            dotnet pack "$project" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-browser
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-packages
          path: artifacts/packages
          if-no-files-found: ignore
      - name: Download packages with strict artifact digest validation
        uses: actions/download-artifact@v8
        with:
          name: DrawingSpace-packages
          path: artifacts/downloaded-packages
      - name: Verify complete package round trip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          original = Path('artifacts/packages')
          downloaded = Path('artifacts/downloaded-packages')
          for suffix in ('.nupkg', '.snupkg'):
              expected = {p.name for p in original.glob('*' + suffix)}
              actual = {p.name for p in downloaded.glob('*' + suffix)}
              assert len(expected) == 12 and actual == expected, (suffix, expected, actual)
              for name in expected:
                  assert (original / name).read_bytes() == (downloaded / name).read_bytes(), name
          print('Verified all twelve packages and twelve symbol packages after upload/download.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-browser-validation
          path: |
            artifacts/screenshots
            artifacts/*-results.json
            artifacts/*-snapshot.json
            artifacts/*-console.log
            artifacts/failure-*.json
            artifacts/server.log
          if-no-files-found: ignore
      - name: Source archive
        if: always()
        run: git archive --format=zip --output=/tmp/DrawingSpace-source.zip HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-source
          path: /tmp/DrawingSpace-source.zip
