name: Browser regression
on:
  push:
    branches: [feat/visio-parity]
    paths: ['.github/workflows/browser-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: DrawingSpace-integrated-browser
          run-id: 36324860256
          github-token: ${{ github.token }}
          path: artifacts/site
      - name: Validate compiled source and browser interactions
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.commit == "84fbf58c8d90401fed985cc8d03ccadb5fc99159"' artifacts/site/build-info.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser-test.mjs');s=p.read_text()
          needle="'Recovery did not restore the edited drawing', 120000);"
          if 'Allow the read-only geometry snapshot' not in s:
              assert needle in s
              s=s.replace(needle,needle+"\n    await page.locator('.uno-loader').waitFor({ state: 'hidden', timeout: 30000 });\n    await page.waitForTimeout(300); // Allow the read-only geometry snapshot to observe the final fitted viewport.")
          needle="    await page.keyboard.down('Alt'); await drag(a,{x:a.x+45,y:a.y+12});"
          assert needle in s
          s=s.replace(needle,"    const focusPoint = screen(state,{x:edge.route[0].x*.75+edge.route[1].x*.25,y:edge.route[0].y*.75+edge.route[1].y*.25});\n    await page.mouse.click(focusPoint.x,focusPoint.y); await page.waitForTimeout(300);\n"+needle)
          old="  await action(); results.push({ name, passed: true, milliseconds: Date.now() - started }); console.log(`PASS ${name}`);"
          assert old in s
          s=s.replace(old,"  try { "+old.strip()+" } catch(error) { results.push({name,passed:false,error:error.stack}); console.error(name,error.message); await page.screenshot({path:`${output}/screenshots/failure-${results.length}.png`}); }")
          s=s.replace("  assert.deepEqual(errors, [], 'The browser reported JavaScript or WebAssembly errors');","  assert.ok(results.every(r=>r.passed), 'One or more browser scenarios failed');\n  assert.deepEqual(errors, [], 'The browser reported JavaScript or WebAssembly errors');")
          p.write_text(s)
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-browser-regressions
          path: |
            artifacts/screenshots
            artifacts/browser-results.json
            artifacts/browser-snapshot.json
            artifacts/browser-console.log
            scripts/browser-test.mjs
