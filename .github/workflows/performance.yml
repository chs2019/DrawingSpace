name: Performance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Compile deterministic headless benchmarks
        run: |
          dotnet build tools/DrawingSpace.RoutingBenchmarks -c Release
          dotnet build tools/DrawingSpace.CrossingBenchmarks -c Release
          dotnet build tools/DrawingSpace.DataBenchmarks -c Release
          dotnet build tools/DrawingSpace.SourceBenchmarks -c Release
      - name: Measure routing, data, text and connector-path time and allocations
        shell: bash
        env:
          # Avoid measuring Tier-0/Tier-1 transitions between compared implementations.
          DOTNET_TieredCompilation: '0'
        run: |
          mkdir -p artifacts/performance
          dotnet run --project tools/DrawingSpace.RoutingBenchmarks -c Release --no-build > artifacts/performance/routing.json
          dotnet run --project tools/DrawingSpace.CrossingBenchmarks -c Release --no-build > artifacts/performance/crossings.json
          dotnet run --project tools/DrawingSpace.DataBenchmarks -c Release --no-build > artifacts/performance/data-text.json
          dotnet run --project tools/DrawingSpace.SourceBenchmarks -c Release --no-build > artifacts/performance/source-paths.json
          git rev-parse HEAD > artifacts/performance/commit.txt
          cat artifacts/performance/routing.json
          cat artifacts/performance/crossings.json
          cat artifacts/performance/data-text.json
          cat artifacts/performance/source-paths.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-routing-performance
          path: artifacts/performance
          retention-days: 30
