name: Final workbench validation
on:
  push:
    branches: [feat/visio-parity]
    paths: ['.github/integration/finalize.patch.xz', '.github/workflows/finalize-workbench.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/DrawingSpace' && github.ref == 'refs/heads/feat/visio-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Commit integrity-checked source fixes only
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,lzma,subprocess
          payload=lzma.decompress(Path('.github/integration/finalize.patch.xz').read_bytes())
          assert len(payload)==22897
          assert hashlib.sha256(payload).hexdigest()=='894b75a90db1e463ccd9d613057ccf686a44da38295baaa839824512a1e57a41'
          Path('/tmp/finalize.patch').write_bytes(payload)
          subprocess.run(['git','apply','--check','--exclude=.github/workflows/*','--unidiff-zero','/tmp/finalize.patch'],check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--unidiff-zero','/tmp/finalize.patch'],check=True)
          Path('.github/integration/finalize.patch.xz').unlink()
          PY
          git add -A
          git diff --cached --check
          git config user.name 'DrawingSpace integration'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: finalize connector grips, print-layer exports and browser regressions'
          git push origin HEAD:refs/heads/feat/visio-parity
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  engine:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run complete regression suite
        run: dotnet test tests/DrawingSpace.Tests -c Release --logger 'trx;LogFileName=engine.trx' --results-directory artifacts/tests
      - name: Compile actual Uno desktop host
        run: dotnet build src/DrawingSpace.App -f net10.0-desktop -c Release -p:DrawingSpaceDesktopOnly=true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-final-engine-tests
          path: artifacts/tests
      - name: Archive the exact committed source
        if: always()
        run: git archive --format=zip --output=/tmp/DrawingSpace-0.2.0-alpha.1-source.zip HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-final-source
          path: /tmp/DrawingSpace-0.2.0-alpha.1-source.zip
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install WebAssembly toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish the actual Uno browser host
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/DrawingSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/DrawingSpace/
          GITHUB_SHA="$(git rev-parse HEAD)" python3 scripts/collect-site.py artifacts/publish artifacts/site
      - name: Validate real browser pointer, keyboard, file and recovery workflows
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          npm run test:browser
          python3 scripts/publish-preview.py
      - name: Build and verify all twelve reusable packages
        shell: bash
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            case "$project" in */DrawingSpace.App/*) continue;; esac
            dotnet pack "$project" -c Release -o artifacts/packages
          done
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as E
          packages=list(Path('artifacts/packages').glob('*.nupkg'))
          assert len(packages)==12,len(packages)
          for package in packages:
              with zipfile.ZipFile(package) as z:
                  spec=E.fromstring(z.read(next(n for n in z.namelist() if n.endswith('.nuspec'))))
                  assert next(e.text for e in spec.iter() if e.tag.rsplit('}',1)[-1]=='version')=='0.2.0-alpha.1'
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-final-browser
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-final-packages
          path: artifacts/packages
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DrawingSpace-final-browser-tests
          path: |
            artifacts/screenshots
            artifacts/browser-results.json
            artifacts/browser-snapshot.json
            artifacts/failure-*.json
            artifacts/browser-console.log
            artifacts/server.log
          if-no-files-found: ignore
