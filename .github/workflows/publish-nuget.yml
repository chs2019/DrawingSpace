name: Publish NuGet
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main-branch Build run containing packages to publish
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    steps:
      - name: Validate trusted build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$RUN" --jq '{conclusion, head_branch, event, path}' > /tmp/build.json
          jq -e '.conclusion == "success" and .head_branch == "main" and .event != "pull_request" and .path == ".github/workflows/build.yml"' /tmp/build.json
      - uses: actions/download-artifact@v4
        with:
          name: DrawingSpace-packages
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish package artifacts
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY" || { echo 'Configure NUGET_API_KEY in the nuget environment.' >&2; exit 1; }
          dotnet nuget push 'packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
