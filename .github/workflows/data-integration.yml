name: Integrate data parity
on:
  push:
    branches: [feat/data-graphics-refresh]
    paths: [.github/data-integration.patch, .github/workflows/data-integration.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/data-graphics-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply exact reviewed integration patch
        run: |
          git merge-base --is-ancestor 5f00003e893016aed92e25843799faa8b472598e HEAD
          git apply --check --whitespace=error-all .github/data-integration.patch
          git apply --whitespace=error-all .github/data-integration.patch
          git rm .github/data-integration.patch .github/workflows/data-integration.yml
      - name: Validate engine and data regressions
        run: dotnet test tests/DrawingSpace.Tests -c Release --logger 'trx;LogFileName=data.trx' --results-directory artifacts/tests
      - name: Compile actual Uno desktop host
        run: dotnet build src/DrawingSpace.App -c Release -f net10.0-desktop -p:DrawingSpaceDesktopOnly=true
      - name: Commit validated integration without temporary patch or workflow
        run: |
          git add src tests docs scripts tools README.md .github/workflows/performance.yml
          git diff --cached --check
          git config user.name 'DrawingSpace integration'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'Integrate linked data, four graphic families and allocation-free cache hot paths'
          git push origin HEAD:refs/heads/feat/data-graphics-refresh
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-data-integration-tests
          path: artifacts/tests
          if-no-files-found: ignore
