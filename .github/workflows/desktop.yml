name: Desktop
on:
  push:
    branches: [main, feat/visio-parity]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build native desktop host
        run: dotnet build src/DrawingSpace.App -f net10.0-desktop -c Release -p:DrawingSpaceDesktopOnly=true
