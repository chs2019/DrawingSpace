name: Integrated workbench
on:
  push:
    branches: [feat/visio-parity]
    paths:
      - '.github/integration/**'
      - '.github/workflows/integrate-workbench.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-workbench-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/visio-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Materialize integrity-checked source changes
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/integration/workbench.part0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import hashlib,lzma,subprocess
          parts=[Path(f'.github/integration/workbench.part{i}') for i in range(4)]
          payload=lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert len(payload)==175078, 'Unexpected patch length'
          assert hashlib.sha256(payload).hexdigest()=='e1bf2df222c0518338a8172f0f0e7df888da1f62618ceeb678f0f07a1a4912a9', 'Patch integrity mismatch'
          Path('/tmp/workbench.patch').write_bytes(payload)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/workbench.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/workbench.patch'],check=True)
          PY
            git rm -r .github/integration
            git add src tests scripts docs README.md CHANGELOG.md Directory.Build.props THIRD-PARTY-NOTICES.md
            git diff --cached --check
            git config user.name 'DrawingSpace integration'
            git config user.email 'wieslawsoltes@users.noreply.github.com'
            git commit -m 'feat: integrate Visio workbench, semantic master bundles, rich text and connector editing'
            git push origin HEAD:refs/heads/feat/visio-parity
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  engine:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run full engine, rich text and interchange regression suite
        run: dotnet test tests/DrawingSpace.Tests -c Release --logger 'trx;LogFileName=engine.trx' --results-directory artifacts/tests
      - name: Compile real Uno desktop workbench
        run: dotnet build src/DrawingSpace.App -f net10.0-desktop -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-integrated-engine-tests
          path: artifacts/tests
      - name: Archive committed source
        if: always()
        run: git archive --format=zip --output=/tmp/DrawingSpace-0.2.0-alpha.1-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-integrated-source
          path: /tmp/DrawingSpace-0.2.0-alpha.1-source.zip
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebAssembly toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish actual Uno WebAssembly workbench
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/DrawingSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/DrawingSpace/
          GITHUB_SHA="$(git rev-parse HEAD)" VERSION=0.2.0-alpha.1 python3 scripts/collect-site.py artifacts/publish artifacts/site
      - name: Run pointer, keyboard, file and recovery browser acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          npm run test:browser
      - name: Pack all twelve reusable libraries
        run: |
          for project in src/*/*.csproj; do
            case "$project" in */DrawingSpace.App/*) continue;; esac
            dotnet pack "$project" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-integrated-browser
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-integrated-packages
          path: artifacts/packages
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrawingSpace-integrated-browser-tests
          path: |
            artifacts/screenshots
            artifacts/browser-results.json
            artifacts/browser-snapshot.json
            artifacts/browser-console.log
            artifacts/server.log
          if-no-files-found: ignore
